id: matriculas_basica
nome: Matrículas na educação básica, por etapa e rede
descricao: >-
  Número de matrículas na educação básica por etapa de ensino (educação básica
  total, educação infantil, creche, pré-escola, ensino fundamental, anos
  iniciais, anos finais e ensino médio) e, onde a fonte publica, por rede
  (federal, estadual, municipal e privada), por Brasil, região e unidade da
  federação. A unidade é uma contagem de matrículas.
eixo: educacao_basica
categoria: acesso_e_oferta
unidade: matrículas
orgao: INEP
periodicidade: anual
metodologia: >-
  Contagens das Sinopses Estatísticas da Educação Básica do INEP (Censo
  Escolar). Cada ano é um arquivo distinto, e cada arquivo é uma parte da série
  (`partes`), com a coleta guardando todos os anos num único pacote. A etapa
  vai em `etapa` (`educacao_basica`, `educacao_infantil`, `creche`,
  `pre_escola`, `ensino_fundamental`, `anos_iniciais`, `anos_finais`,
  `ensino_medio`) e a rede em `rede` (`total`, `federal`, `estadual`,
  `municipal`, `privada`); a rede `total` de cada etapa vem da tabela por etapa
  e as redes vêm das tabelas por dependência administrativa, sem repetir a
  mesma célula. `censo_escolar_pre2007` lê as tabelas 1.1, 1.6, 1.12, 1.18 e
  1.43 do `.xls` de resultados do Censo Escolar (uma linha por território);
  `educacenso` lê as tabelas 1.1, 1.5 e 1.14 da sinopse (uma linha por
  município, com as linhas de Brasil, regiões e UFs entre elas, separadas pelo
  filtro de município vazio).
observacoes: >-
  (1) Brasil fora do Nordeste por soma (Brasil menos Nordeste), etapa a etapa e
  rede a rede. (2) As duas séries não são comparáveis nas etapas do ensino
  fundamental: até 2006 a fonte publica o ensino fundamental por rede (sem
  separar anos iniciais e finais), e de 2007 em diante publica anos iniciais e
  anos finais por rede, mas o ensino fundamental só no total. Por isso o ensino
  fundamental por rede só existe em `censo_escolar_pre2007` e os anos iniciais
  e finais por rede só em `educacenso`. (3) O ensino médio por rede só existe
  em `censo_escolar_pre2007`: nas sinopses de 2007 em diante as tabelas de
  ensino médio por dependência vêm por série, sem total do ensino médio, e o
  padronizador não soma colunas. (4) Pendências de cobertura: 2000 a 2004
  (2003 e 2004 só em PDF; 2000 a 2002 com layout de abas próprio, não lido) e
  2022 a 2025 (a sinopse de 2022 tem 309 MB e não terminou de baixar em cinco
  minutos; as de 2023 e 2024 mudam o cabeçalho das tabelas 1.1, 1.5 e 1.14 e a
  de 2025 renumera as tabelas, e a série precisa ser contínua). (5)
  `defasagem_meses`: as sinopses saem de dois a sete meses depois do fim do ano
  (a de 2025 foi atualizada em julho de 2026); seis meses é uma estimativa. (6)
  Custo operacional de `educacenso`: o download tem ~2 GB (15 arquivos), o
  pacote bruto guardado tem ~1,9 GB e o `coletar` e o `consolidar` usam ~4 GB de
  RAM; a coleta leva de 50 a 60 minutos em sequência, a ~0,5 MB/s. A coleta de
  rede sequencial desses arquivos grandes não foi exercitada: os layouts foram
  conferidos sobre os arquivos reais baixados à parte. Rode `coletar
  --indicador matriculas_basica` isoladamente.
sentido: maior_melhor
limites: {min: 0}
defasagem_meses: 6
comparacao:
  referencia: brasil_fora_ne
  metodo: soma
