id: matriculas_basica
nome: Matrículas na educação básica, por etapa e rede
descricao: >-
  Número de matrículas na educação básica por etapa de ensino (educação básica
  total, educação infantil, creche, pré-escola, ensino fundamental, anos
  iniciais, anos finais e ensino médio) e, onde a fonte publica, por rede
  (federal, estadual, municipal e privada), por Brasil, região e unidade da
  federação. A unidade é uma contagem de matrículas.
eixo: educacao_basica
categoria: acesso_e_oferta
unidade: matrículas
orgao: INEP
periodicidade: anual
metodologia: >-
  Contagens das Sinopses Estatísticas da Educação Básica do INEP (Censo
  Escolar). Cada ano é um arquivo distinto, e cada arquivo é uma parte da série
  (`partes`), com a coleta guardando todos os anos num único pacote. A etapa
  vai em `etapa` (`educacao_basica`, `educacao_infantil`, `creche`,
  `pre_escola`, `ensino_fundamental`, `anos_iniciais`, `anos_finais`,
  `ensino_medio`) e a rede em `rede` (`total`, `federal`, `estadual`,
  `municipal`, `privada`); a rede `total` de cada etapa vem da tabela por etapa
  e as redes vêm das tabelas por dependência administrativa, sem repetir a
  mesma célula. `censo_escolar_2000_2002` lê as abas 1.1, 1.5, 1.13 e 1.36 do
  `.xls` da sinopse (uma linha por território; cada aba traz o total e as quatro
  redes de uma etapa); `censo_escolar_pre2007` lê as tabelas 1.1, 1.6, 1.12,
  1.18 e 1.43 do `.xls` de resultados do Censo Escolar (uma linha por
  território); `educacenso` lê as tabelas 1.1, 1.5 e 1.14 da sinopse (1.1, 1.8 e
  1.20 na de 2025, que renumerou as tabelas; uma linha por município, com as
  linhas de Brasil, regiões e UFs entre elas, separadas pelo filtro de município
  vazio).
observacoes: >-
  (1) Brasil fora do Nordeste por soma (Brasil menos Nordeste), etapa a etapa e
  rede a rede. (2) As séries não são comparáveis nas etapas do ensino
  fundamental: até 2006 (`censo_escolar_2000_2002` e `censo_escolar_pre2007`) a
  fonte publica o ensino fundamental por rede (sem separar anos iniciais e
  finais), e de 2007 em diante publica anos iniciais e anos finais por rede, mas
  o ensino fundamental só no total. Por isso o ensino fundamental por rede só
  existe nas duas séries antigas e os anos iniciais e finais por rede só em
  `educacenso`. (3) O ensino médio por rede só existe nas duas séries antigas:
  nas sinopses de 2007 em diante as tabelas de ensino médio por dependência vêm
  por série, sem total do ensino médio, e o padronizador não soma colunas. As
  sinopses de 2000 e 2001 também não trazem os totais da educação básica e da
  educação infantil, e por isso `censo_escolar_2000_2002` só tem creche,
  pré-escola, ensino fundamental e ensino médio. (4) Pendência de cobertura: 2003
  e 2004 só existem em PDF (o projeto não lê PDF) e não têm série; os anos de
  PDF não são `anos_sem_publicacao`, porque o Censo Escolar existiu, e por isso
  `censo_escolar_2000_2002` (2000 a 2002) não se junta a `censo_escolar_pre2007`
  (2005 e 2006): a cobertura efetiva é 2000–2002; 2005–2025, com o buraco à
  mostra. A tabela 1.1 das sinopses de 2023 e 2024 tem células de cabeçalho com
  espaços (nomes de coluna repetidos); a ficha usa a linha 5, vazia, como
  cabeçalho dessas duas partes. A sinopse de 2025 (arquivo `_V2`, atualizada em
  julho de 2026) renumera as tabelas para 1.1, 1.8 e 1.20 e põe as redes em
  outras colunas; a de 2022 traz o `.xlsx` dentro de duas pastas e ao lado de um
  zip de 146 MB. (5)
  `defasagem_meses`: as sinopses saem de dois a sete meses depois do fim do ano
  (a de 2025 foi atualizada em julho de 2026); seis meses é uma estimativa. (6)
  Custo operacional de `educacenso`: o download tem ~2,7 GB (19 arquivos, 2.696
  MB) e leva ~49 minutos em sequência (0,9 MB/s medido; até 60 minutos a 0,5
  MB/s); o pacote bruto guardado tem ~37 MB (de cada sinopse, só as três abas
  lidas). A coleta de rede foi exercitada de ponta a ponta e medida em
  2026-11-01: `coletar --indicador matriculas_basica` levou 2.946 s com pico de
  145 MB de RAM, e o `consolidar` das três séries, 129 s e 270 MB. Rode
  `coletar --indicador matriculas_basica` isoladamente.
sentido: maior_melhor
limites: {min: 0}
defasagem_meses: 6
comparacao:
  referencia: brasil_fora_ne
  metodo: soma
