id: superior
nome: Ensino superior, matrículas de graduação e instituições
descricao: >-
  Matrículas nos cursos de graduação (total, em instituições públicas e em
  instituições privadas) e número de instituições de educação superior (IES),
  com o recorte das universidades, por Brasil, região e unidade da federação.
  A unidade é uma contagem; quanto maior, maior a oferta de ensino superior.
eixo: educacao_superior
categoria: oferta_de_ensino
unidade: número (matrículas ou instituições)
orgao: INEP
periodicidade: anual
metodologia: >-
  Contagens da Sinopse Estatística da Educação Superior do INEP (Censo da
  Educação Superior), por Brasil, região e UF. Três subindicadores:
  `matriculas` (matrículas em cursos de graduação, rede `total`, `publica` e
  `privada`), `ies` (todas as instituições, por sede administrativa, rede
  `total`) e `universidades` (as instituições de organização acadêmica
  "Universidade", rede `total`). Cada ano é um arquivo distinto, e cada arquivo
  é uma parte da série (`partes`), com a coleta guardando todos os anos num
  único pacote. As duas séries têm métodos de contagem diferentes e não se
  somam nem se comparam: `censup_pre2009` (2001 a 2008) lê as tabelas 1.1 e
  5.1 dos `.xls` de cada ano (matrículas em cursos de graduação presenciais);
  `censup` (2009 a 2024) lê as mesmas tabelas da sinopse por município
  (matrículas em cursos de graduação presenciais e a distância).
observacoes: >-
  (1) Brasil fora do Nordeste por soma (Brasil menos Nordeste), subindicador a
  subindicador e rede a rede. (2) `censup_pre2009`: só a rede `total` nas
  matrículas, porque as linhas de Pública e Privada vêm abaixo da linha do
  território, sem o nome dele, e o padronizador lê um território por linha; as
  matrículas são só as de cursos presenciais. O ano de 2000 só existe em PDF.
  (3) `censup`: cobre 2009 a 2024. O Censo da Educação Superior de 2025 ainda
  não foi publicado (em 2026-11-01 o arquivo `sinopse_educacao_superior_2025.zip`
  não existe no servidor do INEP e a página das sinopses lista até 2024); a
  série tem `fim: 2024` e ganha o ano quando ele sair, o que a validação não
  avisa, porque série com `fim` declarado não entra no aviso de publicação
  vencida. (4) `defasagem_meses`: o Censo da Educação Superior de cada ano sai
  cerca de dez meses depois do fim do ano. (5) Nas matrículas do `censup`, o
  Brasil é maior que a soma das cinco regiões: a tabela 5.1 traz uma linha
  "Exterior" (matrículas a distância de instituições brasileiras no exterior,
  fora de qualquer região e UF) que só entra no total do Brasil; a diferença
  foi de 284 a 2.826 matrículas nos anos em que ela existe (2009, 2010 e 2017
  a 2024; nos outros é zero), sempre igual à linha "Exterior". Por isso o Brasil fora do Nordeste
  das matrículas, por soma, inclui essas matrículas do exterior. (6) Layout de
  2020 a 2024: as abas, as linhas e as colunas lidas por posição são as de 2009
  a 2019, com três diferenças só de leitura: a linha de total da UF vem com dois
  espaços ("Total  Maranhão") em 2021 (aba 1.1) e em 2022 (abas 1.1 e 5.1), e a
  ficha escreve esses nomes assim; em 2024 a tabela 5.1 troca de lugar o
  município e o nível acadêmico (o nível passa para a coluna 4 e o município para
  a 2); e na aba 1.1 de 2024 a linha de total do Acre está rotulada "Total
  Rondônia" (erro da fonte, fora do Nordeste, que a ficha não lê). (7) Custo
  operacional de `censup`: o download tem ~3,7 GB (16 arquivos, 3.664 MB) e leva
  ~72 minutos em sequência (0,85 MB/s medido; até 2 horas a 0,5 MB/s); o pacote bruto guardado tem ~38 MB (de cada sinopse, só as
  abas 1.1 e 5.1). A coleta de rede foi exercitada de ponta a ponta e medida em
  2026-11-01: `coletar --indicador superior` levou 4.296 s com pico de 344 MB de
  RAM, e o `consolidar` das duas séries, 375 s e 426 MB. `censup_pre2009` (8
  arquivos, 32 MB): coleta de rede de 71 s, pico de 123 MB de RAM, pacote de 32
  MB (cada zip só traz o .xls lido). Rode `coletar --indicador superior`
  isoladamente.
sentido: maior_melhor
limites: {min: 0}
defasagem_meses: 10
comparacao:
  referencia: brasil_fora_ne
  metodo: soma
