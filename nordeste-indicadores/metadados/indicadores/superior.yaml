id: superior
nome: Ensino superior, matrículas de graduação e instituições
descricao: >-
  Matrículas nos cursos de graduação (total, em instituições públicas e em
  instituições privadas) e número de instituições de educação superior (IES),
  com o recorte das universidades, por Brasil, região e unidade da federação.
  A unidade é uma contagem; quanto maior, maior a oferta de ensino superior.
eixo: educacao_superior
categoria: oferta_de_ensino
unidade: número (matrículas ou instituições)
orgao: INEP
periodicidade: anual
metodologia: >-
  Contagens da Sinopse Estatística da Educação Superior do INEP (Censo da
  Educação Superior), por Brasil, região e UF. Três subindicadores:
  `matriculas` (matrículas em cursos de graduação, rede `total`, `publica` e
  `privada`), `ies` (todas as instituições, por sede administrativa, rede
  `total`) e `universidades` (as instituições de organização acadêmica
  "Universidade", rede `total`). Cada ano é um arquivo distinto, e cada arquivo
  é uma parte da série (`partes`), com a coleta guardando todos os anos num
  único pacote. As duas séries têm métodos de contagem diferentes e não se
  somam nem se comparam: `censup_pre2009` (2001 a 2008) lê as tabelas 1.1 e
  5.1 dos `.xls` de cada ano (matrículas em cursos de graduação presenciais);
  `censup` (2009 em diante) lê as mesmas tabelas da sinopse por município
  (matrículas em cursos de graduação presenciais e a distância).
observacoes: >-
  (1) Brasil fora do Nordeste por soma (Brasil menos Nordeste), subindicador a
  subindicador e rede a rede. (2) `censup_pre2009`: só a rede `total` nas
  matrículas, porque as linhas de Pública e Privada vêm abaixo da linha do
  território, sem o nome dele, e o padronizador lê um território por linha; as
  matrículas são só as de cursos presenciais. O ano de 2000 só existe em PDF.
  (3) `censup`: cobre 2009 a 2019, anos cujo arquivo se baixa em menos de
  cinco minutos; os arquivos de 2020 a 2024 têm de 284 a 397 MB e ficam como
  pendência (e o de 2025 ainda não foi publicado). (4) `defasagem_meses`: o
  Censo da Educação Superior de cada ano sai cerca de dez meses depois do fim
  do ano. (5) Custo operacional de `censup`: o download tem ~2 GB (11
  arquivos, 1.937 MB) e leva de 35 a 60 minutos em sequência (0,9 a 0,5
  MB/s); o pacote bruto guardado tem ~25 MB (de cada sinopse, só as abas 1.1 e
  5.1), e o `coletar` sobre os arquivos reais baixados à parte usou 351 MB de
  RAM. A coleta de rede do `censup` não foi repetida; a do `educacenso`, com o
  mesmo coletor e arquivos do mesmo porte, foi exercitada de ponta a ponta
  (ficha `matriculas_basica`). `censup_pre2009` (8 arquivos, 32 MB): coleta de
  rede de 71 s, pico de 123 MB de RAM, pacote de 32 MB (cada zip só traz o
  .xls lido). Rode `coletar --indicador superior` isoladamente.
sentido: maior_melhor
limites: {min: 0}
defasagem_meses: 10
comparacao:
  referencia: brasil_fora_ne
  metodo: soma
