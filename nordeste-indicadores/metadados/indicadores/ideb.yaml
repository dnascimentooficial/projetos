id: ideb
nome: Índice de Desenvolvimento da Educação Básica (IDEB)
descricao: >-
  IDEB dos anos iniciais e dos anos finais do ensino fundamental e do ensino
  médio, por Brasil, região e unidade da federação, no total das redes de
  ensino. Vai de 0 a 10; quanto maior, melhor.
eixo: educacao_basica
categoria: qualidade_do_ensino
unidade: índice (0 a 10)
orgao: INEP
periodicidade: bienal (anos ímpares)
metodologia: >-
  O INEP calcula o IDEB como o produto da nota média padronizada do Saeb (N)
  pelo indicador de rendimento escolar (P, a partir das taxas de aprovação do
  Censo Escolar). Três subindicadores, `anos_iniciais`, `anos_finais` e
  `ensino_medio` (ensino médio regular, sem o integrado), todos na rede
  `total` (linha "Total" das planilhas, o conjunto das redes pública e
  privada). Os valores são os das colunas "IDEB
  <ano> (N x P)" das planilhas de divulgação do IDEB 2025, que trazem todas as
  edições de 2005 a 2025: regiões e UFs num arquivo, o Brasil em outro, cada um
  com uma aba por etapa. As seis abas são partes da mesma série (`partes`), e
  a coleta guarda os dois arquivos num único pacote. Uma edição nova exige rever
  `fim`, as URLs e as colunas das partes.
observacoes: >-
  (1) Edição de 2021: aplicada durante a pandemia de covid-19, com mudanças na
  participação e no fluxo escolar (aprovação atípica); o INEP recomenda cautela
  na comparação com as demais edições (nota informativa do Ideb 2021). (2) Só há
  edição nos anos ímpares; os anos pares não têm linha. (3) O IDEB não se
  recalcula a partir das UFs nem de totais: não há Brasil fora do Nordeste, e a
  comparação é com o Brasil. (4) Só a rede `total`: a planilha de regiões e UFs
  do ensino médio não traz a linha da rede pública, e as metas do primeiro ciclo
  (2007 a 2021) não entram. (5) `defasagem_meses` só alimenta a próxima
  publicação esperada, contada a partir de dezembro do ano seguinte ao último
  disponível: a edição de 2025 saiu em agosto de 2026 (cerca de 8 meses), e a
  próxima, de 2027, deve sair em agosto de 2028, por isso 20 meses.
sentido: maior_melhor
limites: {min: 0, max: 10}
defasagem_meses: 20
comparacao:
  referencia: brasil
