id: abandono_em
nome: Taxa de abandono no ensino médio
descricao: >-
  Taxa de abandono escolar no ensino médio (total das séries, incluindo o não
  seriado), em porcentagem dos alunos matriculados, por Brasil, região e unidade
  da federação, no total das localizações (urbana e rural) e das redes de
  ensino. Quanto menor, melhor.
eixo: educacao_basica
categoria: fluxo_escolar
unidade: "%"
orgao: INEP
periodicidade: anual
metodologia: >-
  Taxa de abandono do ensino médio das planilhas "Taxas de Rendimento Escolar"
  dos Indicadores Educacionais do INEP, calculada a partir do Censo Escolar: o
  percentual de alunos que deixaram de frequentar a escola durante o ano letivo
  (colunas "Total Abandono - Médio" nos arquivos de 2007 a 2010, "Taxa de
  Abandono - Ensino Médio" de 2011 a 2015, `tab_MED` em 2016 a 2020 e
  `3_CAT_MED` a partir de 2021). Linha de localização "Total" e de rede
  (dependência administrativa) "Total", ou seja, urbana e rural, redes pública
  e privada. Cada ano é publicado em arquivos distintos, de layout próprio:
  de 2007 a 2016 o Brasil, as regiões e as UFs vêm em três planilhas (`.xls`
  até 2012 e `.xlsx` depois, com UFs por sigla até 2014) e de 2017 em diante
  numa só. Cada arquivo é uma parte da série (`partes`), com o ano conferido na
  própria coluna de ano da planilha, e a coleta guarda os 19 zips num único
  pacote. Uma edição nova exige acrescentar as partes e rever `fim`.
observacoes: >-
  (1) Anos de pandemia: em 2020 e 2021 a taxa de abandono foi afetada pelo
  ensino remoto e pelas regras excepcionais de aprovação; o INEP recomenda
  cautela na comparação com os demais anos. (2) A taxa não se recalcula a
  partir das UFs nem de totais publicados: não há Brasil fora do Nordeste, e a
  comparação é com o Brasil. (3) Só o total do ensino médio, na rede `total`;
  as taxas por série, por localização e por rede do mesmo arquivo não entram.
  (4) `defasagem_meses`: a taxa de cada ano letivo sai de seis a oito meses
  depois do fim do ano (2025 em 26/06/2026, 2024 em 11/08/2025).
sentido: menor_melhor
limites: {min: 0, max: 100}
defasagem_meses: 8
comparacao:
  referencia: brasil
