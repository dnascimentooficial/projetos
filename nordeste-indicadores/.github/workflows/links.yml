name: Links das fontes

# Uma vez por mês confere se as URLs das séries respondem. Só avisa: link quebrado abre (ou comenta) uma issue e
# não bloqueia nada; erro da própria conferência (código 2) falha o job.

on:
  schedule:
    - cron: "0 9 1 * *" # dia 1, 06h de Brasília
  workflow_dispatch:

permissions:
  contents: read
  issues: write

defaults:
  run:
    shell: bash

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Conferir os links
        id: links
        run: |
          codigo=0
          python -m nordeste.automacao links > "$RUNNER_TEMP/quebrados.tsv" || codigo=$?
          case "$codigo" in
            0) echo "Todos os links das fontes respondem." ;;
            1)
              {
                echo "A conferência mensal achou URLs de séries que não respondem (indicador, URL, motivo)."
                echo "Confira cada uma e atualize a ficha em metadados/indicadores/ se a fonte mudou de endereço."
                echo
                echo '```'
                cat "$RUNNER_TEMP/quebrados.tsv"
                echo '```'
              } > "$RUNNER_TEMP/corpo.md"
              .github/scripts/abrir-issue.sh "Links quebrados nas fontes" "$RUNNER_TEMP/corpo.md"
              ;;
            *) exit "$codigo" ;;
          esac
