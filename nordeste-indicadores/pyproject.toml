[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nordeste"
version = "0.1.0"
description = "Base historica de indicadores do Nordeste brasileiro"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "numpy",
    "pyarrow",
    "pyyaml",
    "requests",
    "certifi",
    "openpyxl",
    "xlrd",
    "jinja2",
]

[project.optional-dependencies]
dev = ["pytest", "pillow"]
site = ["playwright"]
ferramentas = ["shapely"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nordeste.site" = ["modelos/*.html", "estaticos/*", "estaticos/.htaccess", "estaticos/**/*"]

[tool.pytest.ini_options]
testpaths = ["testes"]
markers = [
    "rede: acessa fontes oficiais reais",
    "navegador: abre o Chromium (precisa do extra site)",
]
addopts = "-m 'not rede and not navegador'"
